name: ci
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker buildx build -t ${{ vars.DOCKERHUB_USERNAME }}/liatrio-apprenticeship-exercise:${{ github.run_number }} --load .

      - name: Run container on port 80
        run: docker run -d -p 80:3000 ${{ vars.DOCKERHUB_USERNAME }}/liatrio-apprenticeship-exercise:${{ github.run_number }}

      - name: run tests
        uses: liatrio/github-actions/apprentice-action@0b41561cca6822cc8d880fe0e49e7807a41fdf91

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/liatrio-apprenticeship-exercise:${{ github.run_number }}
